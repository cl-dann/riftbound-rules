name: Tesztek (ellenőrzők, unit, Playwright)

# PR-en és kézzel fut, a main-re pusholt commitot a deploy.yml futtatja (workflow_call), és csak zöld teszt után élesít.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python ellenőrzés (ruff)
        run: |
          pip install ruff==0.16.9 pytest==9.1.1
          ruff check src/ tools/
      - name: Adatok és pytest (a pipeline kétszer fut, a kimenet azonos kell legyen)
        run: python3 -m pytest src/tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Kötőjel-ellenőrzés (U+2013, U+2014)
        run: node scripts/check-dashes.mjs
      - name: Függőségek
        working-directory: web
        run: npm ci
      - name: Build (tsc -b és vite build), bundle térkép
        working-directory: web
        env:
          ANALYZE: '1'
        run: npm run build
      - name: Bundle térkép feltöltése
        uses: actions/upload-artifact@v4
        with:
          name: bundle-stats
          path: web/stats.html
          if-no-files-found: warn
      - name: Unit tesztek
        working-directory: web
        run: npx vitest run
      - name: Playwright
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --reporter=line
