<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riftbound szabálykereső</title>
<meta name="description" content="Nem hivatalos Riftbound szabálykereső: kártyánként a rá vonatkozó Core Rules szakaszok, errata és deck szintű szabálylista PDF exporttal. Készítette: Daneehunter.">
<meta name="author" content="Daneehunter">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23161b26'/%3E%3Ctext x='16' y='23' font-family='Arial' font-weight='700' font-size='20' text-anchor='middle' fill='%23e8b84a'%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Saira+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: fejléc forrássávval, három nézet (kártyák, deck, szabályok); a kártya és deck nézet két hasábos: lista balra, szabályok jobbra. */
:root{
  --bg:#eef0f4; --panel:#ffffff; --panel2:#f6f7fa; --ink:#161b26; --muted:#5b6475; --line:#d5d9e2;
  --accent:#9a6a00; --accent-bg:#fff4d6; --link:#1f4fb3;
  --warn:#a23a12; --warn-bg:#fde9df; --ok:#1f6b45; --ok-bg:#e1f3e9;
  --fury:#c0392b; --calm:#2e8b57; --mind:#2f6fd0; --body:#d2691e; --chaos:#7d4bc4; --order:#b8940a;
  --f-display:"Saira Condensed","Arial Narrow",sans-serif; --f-body:"IBM Plex Sans",system-ui,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10131a; --panel:#181c26; --panel2:#1f2430; --ink:#e8ebf2; --muted:#9aa3b5; --line:#2e3545;
    --accent:#e8b84a; --accent-bg:#3a2e10; --link:#8fb4ff;
    --warn:#ff9c78; --warn-bg:#3d1f14; --ok:#7fd3a4; --ok-bg:#143024;
    --fury:#ff7b6b; --calm:#6fcf97; --mind:#7fb0ff; --body:#f2a15e; --chaos:#b996f0; --order:#e6c64a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10131a; --panel:#181c26; --panel2:#1f2430; --ink:#e8ebf2; --muted:#9aa3b5; --line:#2e3545;
  --accent:#e8b84a; --accent-bg:#3a2e10; --link:#8fb4ff;
  --warn:#ff9c78; --warn-bg:#3d1f14; --ok:#7fd3a4; --ok-bg:#143024;
  --fury:#ff7b6b; --calm:#6fcf97; --mind:#7fb0ff; --body:#f2a15e; --chaos:#b996f0; --order:#e6c64a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
a{color:var(--link)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px 48px}
header.top{padding:22px 0 12px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
h1 small{display:block;font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted);margin-top:6px;letter-spacing:0}
.src{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.src span,.src a{border:1px solid var(--line);background:var(--panel);border-radius:3px;padding:3px 8px;color:var(--muted);text-decoration:none}
.src b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
nav.tabs{display:flex;gap:2px;border-bottom:2px solid var(--ink);margin:10px 0 18px}
nav.tabs a{font-family:var(--f-display);font-weight:600;font-size:19px;padding:7px 18px;text-decoration:none;color:var(--muted);border:1px solid transparent;border-bottom:none;border-radius:4px 4px 0 0}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.view{display:none}.view.on{display:block}
.cols{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:20px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px}
.pad{padding:14px 16px}
.filters{display:flex;flex-direction:column;gap:10px}
.filters .row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
input[type=search],input[type=text],select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%}
select{width:auto;flex:1 1 120px}
label.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer}
.count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{background:var(--panel);border:0;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.linkbtn{background:none;border:0;padding:0;color:var(--link);text-decoration:underline;cursor:pointer;font-size:12.5px;align-self:flex-start}
.cols.gridmode{grid-template-columns:1fr}
.cols.gridmode #detail{display:none}
.cols.gridmode ul.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:14px 16px;max-height:none;overflow:visible}
.cols.gridmode ul.list li.more-li{grid-column:1/-1}
.tile{display:flex;flex-direction:column;width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:0;cursor:pointer;text-align:left;overflow:hidden}
.tile:hover{border-color:var(--accent)}
.tile .im{aspect-ratio:744/1039;width:100%;background:var(--panel);display:flex;align-items:center;justify-content:center;position:relative}
.tile .im img{width:100%;height:100%;object-fit:cover;display:block}
.tile .ph{display:none;flex-direction:column;gap:6px;padding:12px;text-align:center;font-size:12.5px;color:var(--muted)}
.tile .ph b{font-family:var(--f-display);font-size:16px;color:var(--ink);line-height:1.15}
.tile .im.noimg .ph{display:flex}
.tile .cap{padding:6px 8px;font-size:12.5px;line-height:1.3;display:flex;flex-direction:column;gap:2px}
.tile .cap b{font-weight:600;font-size:13px}
.tile .cap span{color:var(--muted)}
.tile .bdg{position:absolute;top:6px;left:6px;display:flex;gap:4px}
#modal{position:fixed;inset:0;z-index:40;background:rgba(10,12,18,.55);display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;overflow:auto}
#modal[hidden]{display:none}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:8px;max-width:1000px;width:100%;padding:18px 20px;position:relative}
#modal .x{position:sticky;top:0;float:right;background:var(--ink);color:var(--bg);border:0;border-radius:4px;padding:6px 12px;cursor:pointer;font-weight:600;z-index:2}
ul.list{list-style:none;margin:0;padding:0;max-height:70vh;overflow:auto;border-top:1px solid var(--line)}
ul.list li button{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 16px;cursor:pointer}
ul.list li button:hover{background:var(--panel2)}
ul.list li button[aria-selected="true"]{background:var(--accent-bg);box-shadow:inset 3px 0 0 var(--accent)}
ul.list .nm{flex:1;font-weight:500}
ul.list .ty{font-size:12px;color:var(--muted);white-space:nowrap}
.more{display:block;width:100%;padding:10px;background:var(--panel2);border:0;border-top:1px solid var(--line);cursor:pointer;color:var(--link)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:2px;vertical-align:baseline;background:var(--muted)}
.d-Fury{background:var(--fury)}.d-Calm{background:var(--calm)}.d-Mind{background:var(--mind)}.d-Body{background:var(--body)}.d-Chaos{background:var(--chaos)}.d-Order{background:var(--order)}
.card-head{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
h2{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.1;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:19px;margin:22px 0 8px;letter-spacing:.02em}
h3 .n{font-family:var(--f-body);font-size:12px;font-weight:400;color:var(--muted);margin-left:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px}
.chip{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:3px;padding:2px 8px;background:var(--panel2);white-space:nowrap}
.chip b{font-weight:600;font-variant-numeric:tabular-nums}
.chip.ban{background:var(--warn-bg);color:var(--warn);border-color:var(--warn);font-weight:600}
.chip.err{background:var(--accent-bg);color:var(--accent);border-color:var(--accent);font-weight:600}
.chip.okc{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.ctext{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--ink);border-radius:4px;padding:12px 14px;max-width:72ch}
.ctext p{margin:0 0 8px}.ctext p:last-child{margin:0}
.ctext.old{border-left-color:var(--muted);color:var(--muted)}
.rem{color:var(--muted);font-style:italic}
.kw{font-weight:600;background:var(--accent-bg);color:var(--accent);border-radius:3px;padding:0 5px;white-space:nowrap}
.sym{display:inline-block;min-width:1.5em;text-align:center;font-family:var(--f-mono);font-size:.82em;font-weight:500;border:1px solid var(--muted);border-radius:10px;padding:0 5px;line-height:1.45;white-space:nowrap;vertical-align:baseline}
.sym.en{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sym.dm{color:#fff;border-color:transparent}
.note{font-size:13px;color:var(--muted);max-width:72ch}
.errbox{border:1px solid var(--accent);background:var(--accent-bg);border-radius:4px;padding:10px 14px;margin:12px 0;max-width:72ch;font-size:14px}
.banbox{border:1px solid var(--warn);background:var(--warn-bg);color:var(--warn);border-radius:4px;padding:10px 14px;margin:12px 0;max-width:72ch;font-size:14px}
details.tp{border:1px solid var(--line);border-radius:4px;margin:6px 0;background:var(--panel)}
details.tp>summary{cursor:pointer;padding:8px 12px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;list-style:none}
details.tp>summary::-webkit-details-marker{display:none}
details.tp>summary::before{content:"+";font-family:var(--f-mono);color:var(--muted);width:1ch}
details.tp[open]>summary::before{content:"-"}
details.tp>summary:hover{background:var(--panel2)}
details.tp .rn{font-family:var(--f-mono);font-size:13px;color:var(--accent);font-weight:500;min-width:7ch}
details.tp .tt{font-weight:600;flex:1 1 180px}
details.tp .why{font-size:12.5px;color:var(--muted)}
details.tp .why code{font-family:var(--f-mono);font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.rules{padding:4px 12px 12px;border-top:1px solid var(--line);overflow-x:auto}
.rule{display:grid;grid-template-columns:max-content 1fr;gap:0 10px;padding:3px 0;font-size:14px}
.rule a.id{text-decoration:none}
.rule a.id:hover{color:var(--link);text-decoration:underline}
.rule .id{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px;white-space:nowrap}
.rule .tx{max-width:74ch;white-space:pre-line}
.rule.h .tx{font-weight:600;font-family:var(--f-display);font-size:17px}
.rule .ex{margin:4px 0 2px;padding:4px 10px;border-left:2px solid var(--accent);color:var(--muted);font-size:13px;white-space:normal}
.rule.hit{background:var(--accent-bg)}
.dp1{margin-left:14px}.dp2{margin-left:28px}.dp3{margin-left:42px}.dp4{margin-left:56px}.dp5{margin-left:70px}.dp6{margin-left:84px}
.rel{font-size:12.5px;color:var(--muted);padding:6px 12px 10px;border-top:1px dashed var(--line)}
.rel a{font-family:var(--f-mono);margin-right:8px;white-space:nowrap}
mark{background:var(--accent-bg);color:inherit;outline:1px solid var(--accent)}
textarea#deckin{min-height:420px;font-family:var(--f-mono);font-size:13px;line-height:1.45;resize:vertical}
.btn{background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:4px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.sec{background:var(--panel);color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.status{font-size:13px;color:var(--muted)}
.fmt{font-family:var(--f-mono);font-size:13px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin:0;overflow-x:auto;line-height:1.45}
.chk-list{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.chk-list li{display:grid;grid-template-columns:5.2em 1fr;gap:8px;align-items:baseline;border-bottom:1px solid var(--line);padding:4px 0}
.st{font-size:11px;font-weight:600;border-radius:3px;padding:1px 6px;text-align:center;border:1px solid}
.st.ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok)}.st.bad{color:var(--warn);background:var(--warn-bg);border-color:var(--warn)}.st.inf{color:var(--muted);background:var(--panel2);border-color:var(--line)}
table.im{border-collapse:collapse;width:100%;font-size:13.5px}
table.im th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:4px 10px 4px 0;border-bottom:1px solid var(--ink)}
table.im td{border-bottom:1px solid var(--line);padding:6px 10px 6px 0;vertical-align:top}
table.im td:first-child{font-weight:600;white-space:nowrap}
.curve{display:flex;align-items:flex-end;gap:10px;height:150px;padding:8px 4px 0;border-bottom:1px solid var(--muted);max-width:520px}
.cb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;cursor:default;outline-offset:2px}
.cb .bar{width:100%;max-width:34px;background:var(--accent);border-radius:4px 4px 0 0}
.cb:hover .bar,.cb:focus .bar{filter:brightness(1.15)}
.cb .vl{font-family:var(--f-mono);font-size:12px;color:var(--ink);margin-bottom:3px}
.cb .lb{position:absolute;bottom:-20px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.curvetbl{margin:26px 0 6px}
.curvetbl summary{cursor:pointer}
.dist{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 24px;max-width:640px;margin-bottom:6px}
.dist h4{margin:6px 0 4px;font-size:13px;color:var(--muted);font-weight:600}
.hb{display:grid;grid-template-columns:6.5em 1fr 2.2em;gap:8px;align-items:center;font-size:13px;padding:2px 0}
.hb .ht{height:10px;background:var(--panel2);border-radius:5px;overflow:hidden}
.hb .ht span{display:block;height:100%;background:var(--accent);border-radius:5px}
.hb .hn{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.sum{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.warns{margin:0 0 12px;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.warns li{border:1px solid var(--warn);background:var(--warn-bg);color:var(--warn);border-radius:4px;padding:6px 10px;font-size:13.5px}
.warns li button{background:none;border:0;color:var(--link);text-decoration:underline;cursor:pointer;padding:0 4px}
.sec-title{font-family:var(--f-display);font-weight:600;font-size:18px;margin:16px 0 4px;display:flex;gap:8px;align-items:baseline}
.drow{border:1px solid var(--line);border-radius:4px;margin:4px 0;background:var(--panel)}
.drow>summary{cursor:pointer;list-style:none;padding:7px 12px;display:grid;grid-template-columns:2.2em minmax(140px,1.1fr) minmax(90px,.6fr) 2fr;gap:4px 10px;align-items:baseline}
.drow>summary::-webkit-details-marker{display:none}
.drow>summary:hover{background:var(--panel2)}
.drow .q{font-family:var(--f-mono);color:var(--muted)}
.drow .nm{font-weight:600}
.drow .ty{font-size:12.5px;color:var(--muted)}
.drow .rs{display:flex;flex-wrap:wrap;gap:4px;font-size:11.5px}
.drow .rs span{font-family:var(--f-mono);border:1px solid var(--line);border-radius:3px;padding:0 5px;background:var(--panel2);white-space:nowrap}
.drow .body{padding:10px 14px 14px;border-top:1px solid var(--line)}
.drow.unk>summary{color:var(--warn)}
@media (max-width:620px){.drow>summary{grid-template-columns:2.2em 1fr}.drow .ty,.drow .rs{grid-column:2}}
.guide{max-width:78ch}
.guide p{margin:0 0 10px;font-size:15px;line-height:1.6}
.olv{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.olv li{display:grid;grid-template-columns:8.5em 1fr;gap:10px;align-items:baseline}
.vsin{display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:820px}
.vsin input{flex:1 1 220px;width:auto}
.vsx{color:var(--muted);font-size:13px}
.vsgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:16px 0 4px;max-width:900px}
.vscard{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.vscard b{font-size:16px}
.vscard p{margin:4px 0;font-size:14px}
#vs-out table.nt{max-width:900px}
.kwgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.kwc{border:1px solid var(--line);border-radius:5px;padding:12px 14px;background:var(--panel2)}
.kwc h4{margin:0 0 2px;font-family:var(--f-display);font-size:20px;font-weight:700;display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.kwc h4 a{font-family:var(--f-mono);font-size:12px;font-weight:400}
.kwc .k{font-size:12px;color:var(--muted);margin-bottom:6px}
.kwc p{margin:0 0 6px;font-size:14px}
.kwc ul{margin:0 0 6px;padding-left:0;list-style:none;font-size:13px}
.kwc li{display:grid;grid-template-columns:max-content 1fr;gap:8px;padding:2px 0}
.kwc li a{font-family:var(--f-mono);font-size:12px}
.kwc button{background:none;border:0;color:var(--link);text-decoration:underline;cursor:pointer;padding:0;font-size:12.5px}
ol.flow{margin:0 0 8px;padding:0;list-style:none;counter-reset:st;max-width:92ch}
ol.flow li{counter-increment:st;display:grid;grid-template-columns:2.2em 1fr;gap:4px 8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
ol.flow li::before{content:counter(st);font-family:var(--f-mono);color:var(--accent);font-weight:500}
ol.flow b{font-weight:600}
ol.flow a{font-family:var(--f-mono);font-size:12px;margin-left:6px}
.pn{max-width:92ch;margin-bottom:14px}
.pn ul{margin:4px 0 0;padding-left:18px;font-size:14px}
.subnav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.simgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-bottom:6px}
.simc{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:8px 10px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.simc:hover{border-color:var(--accent)}
.simc b{font-size:13.5px;color:var(--ink);font-weight:600}
.simc .w{color:var(--accent)}
.short{border:1px solid var(--accent);background:var(--accent-bg);border-radius:6px;padding:12px 16px;margin:14px 0 4px;max-width:72ch;font-size:15px;line-height:1.55}
.short b{display:block;font-family:var(--f-display);font-size:17px;margin-bottom:2px;color:var(--accent)}
.short small{display:block;margin-top:6px;font-size:11.5px;color:var(--muted)}
.gl{text-decoration:underline dotted var(--accent);text-underline-offset:3px;text-decoration-thickness:1.5px;cursor:help;border-radius:2px}
.gl:focus-visible{outline:2px solid var(--accent)}
#tip{position:fixed;z-index:50;max-width:min(340px,calc(100vw - 24px));background:var(--ink);color:var(--bg);border-radius:6px;padding:9px 12px;font-size:13.5px;line-height:1.45;box-shadow:0 6px 24px rgba(0,0,0,.25);pointer-events:none}
#tip[hidden]{display:none}
#tip b{display:block;font-family:var(--f-display);font-size:16px;margin-bottom:2px}
#tip .rr{display:block;margin-top:4px;font-family:var(--f-mono);font-size:11.5px;opacity:.75}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:4px 18px;margin:0;padding:0;list-style:none}
.terms li{border-bottom:1px solid var(--line);padding:6px 0;font-size:14px}
.terms li b{font-weight:600}
.terms li a{font-family:var(--f-mono);font-size:12px;margin-left:6px}
.toc{display:flex;flex-direction:column;max-height:74vh;overflow:auto;border-top:1px solid var(--line)}
.toc button{text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:5px 16px;cursor:pointer;font-size:13.5px;display:flex;gap:10px}
.toc button:hover{background:var(--panel2)}
.toc button .id{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.toc button.major{font-family:var(--f-display);font-weight:700;font-size:16px;background:var(--panel2)}
footer{margin-top:28px;font-size:12px;color:var(--muted);max-width:90ch;border-top:1px solid var(--line);padding-top:14px}
footer p{margin:0 0 8px}
footer strong{color:var(--ink);font-weight:600}
.cardtop{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.cardtop .main{flex:1 1 320px;min-width:0}
.cardtop img{flex:0 0 auto;width:210px;max-width:100%;height:auto;border-radius:8px;border:1px solid var(--line)}
table.nt{border-collapse:collapse;width:100%;max-width:92ch;font-size:14px}
table.nt td{border-top:1px solid var(--line);padding:7px 10px 7px 0;vertical-align:top}
table.nt td.r{white-space:nowrap;font-family:var(--f-mono);font-size:12.5px;width:1%}
table.nt td.r a{display:block}
table.nt td.f{width:1%;white-space:nowrap}
.fl{font-size:11px;border-radius:3px;padding:1px 6px;border:1px solid var(--line);color:var(--muted)}
.fl.f1{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.fl.f2{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
.ntwrap{overflow-x:auto}
@media (prefers-reduced-motion:no-preference){details.tp>summary,ul.list li button{transition:background .12s}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Riftbound szabálykereső</h1>
    <div class="src" id="src"></div>
  </header>
  <nav class="tabs" aria-label="Nézetek">
    <a href="#kartyak" data-v="kartyak">Kártyák</a>
    <a href="#deck" data-v="deck">Deck</a>
    <a href="#szabalyok" data-v="szabalyok">Szabályzat</a>
    <a href="#tudastar" data-v="tudastar" id="tab-tud" hidden>Tudástár</a>
  </nav>

  <section class="view" id="v-kartyak">
    <div class="cols">
      <div class="panel">
        <div class="pad filters">
          <input type="search" id="q" placeholder="Kártyanév, tag vagy kulcsszó" autocomplete="off" aria-label="Kártya keresése">
          <div class="row">
            <select id="f-type" aria-label="Típus"><option value="">Minden típus</option></select>
            <select id="f-dom" aria-label="Domain"><option value="">Minden domain</option></select>
          </div>
          <div class="row">
            <select id="f-cost" aria-label="Energy cost"><option value="">Minden Energy</option></select>
            <select id="f-might" aria-label="Might"><option value="">Minden Might</option></select>
          </div>
          <div class="row">
            <select id="f-set" aria-label="Set"><option value="">Minden set</option></select>
            <select id="f-kw" aria-label="Kulcsszó"><option value="">Minden kulcsszó</option></select>
          </div>
          <div class="row">
            <label class="chk"><input type="checkbox" id="f-text"> keresés a kártyaszövegben is</label>
            <label class="chk"><input type="checkbox" id="f-err"> csak errata</label>
            <label class="chk"><input type="checkbox" id="f-ban"> banned kártyák is</label>
          </div>
          <div class="row" style="justify-content:space-between">
            <div class="count" id="count"></div>
            <div class="seg" role="group" aria-label="Nézet">
              <button id="vw-list" aria-pressed="true">Lista</button><button id="vw-grid" aria-pressed="false">Rács</button>
            </div>
          </div>
          <button class="linkbtn" id="f-reset" hidden>Szűrők törlése</button>
        </div>
        <ul class="list" id="list" role="listbox" aria-label="Találatok"></ul>
      </div>
      <div class="panel pad" id="detail" aria-live="polite"></div>
    </div>
  </section>

  <section class="view" id="v-deck">
    <div class="cols">
      <div class="panel pad">
        <label for="deckin" class="note">Decklista. Szekciófejléc (<code>Legend:</code>, <code>Champion:</code>, <code>MainDeck:</code>, <code>Battlefields:</code>, <code>Rune Pool:</code>, <code>Sideboard:</code>), alatta soronként darabszám és kártyanév.</label>
        <textarea id="deckin" spellcheck="false" style="margin-top:8px"></textarea>
        <div class="btnrow">
          <button class="btn" id="deckgo">Deck feldolgozása</button>
          <button class="btn sec" id="deckpdf">PDF letöltése</button>
          <button class="btn sec" id="decklink">Megosztható link másolása</button>
        </div>
        <div class="btnrow">
          <label class="chk"><input type="checkbox" id="pdf-rel"> kapcsolódó szabályok szövege is a PDF-ben</label>
          <label class="chk"><input type="checkbox" id="pdf-gen"> általános szabályok is (Golden/Silver, Playing Cards, Costs)</label>
        </div>
        <div class="status" id="pdfstatus" role="status"></div>
        <input type="text" id="linkout" readonly hidden aria-label="Megosztható link" style="margin-top:8px;font-family:var(--f-mono);font-size:12px">
      </div>
      <div id="deckout"></div>
    </div>
  </section>

  <section class="view" id="v-szabalyok">
    <div class="cols">
      <div class="panel">
        <div class="pad filters">
          <input type="search" id="rq" placeholder="Szabályszám (pl. 811.2) vagy szövegrészlet" autocomplete="off" aria-label="Keresés a szabályzatban">
          <div class="count" id="rcount"></div>
        </div>
        <div class="toc" id="toc"></div>
      </div>
      <div class="panel pad" id="rview"></div>
    </div>
  </section>

  <section class="view" id="v-tudastar">
    <div class="panel pad" id="tud"></div>
  </section>

  <footer id="foot"></footer>
<div id="tip" role="tooltip" hidden></div>
<div id="modal" hidden role="dialog" aria-modal="true" aria-label="Kártya"><div class="box"><button class="x" id="modal-x">Bezárás</button><div id="modal-body"></div></div></div>
</div>

<script id="data" type="application/json">/*DATA*/</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
"use strict";
const D=JSON.parse(document.getElementById('data').textContent);
const RULES=D.rules, TOPICS=D.topics, CARDS=D.cards, META=D.meta;
const TODAY=(()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})();
const BF=META.banfut;const BAN_ACTIVE=!!(BF&&TODAY>=BF.from);
CARDS.forEach(c=>{if(c.banf&&TODAY>=c.banf){c.ban=1;c.banNew=1;}});
const banDate=()=>BAN_ACTIVE?BF.from:META.ban_updated;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[\u2018\u2019`]/g,"'").replace(/[^a-z0-9']+/g,' ').trim();

/* ---------- szabály index ---------- */
const top3=RULES.map(r=>parseInt(r[0].slice(0,3),10));
const isHead=r=>/^\d{3}$/.test(r[0])&&r[1].length<70&&!/[.:]$/.test(r[1]);
function expand(ref){
  const out=[];
  let m=/^(\d{3})-(\d{3})$/.exec(ref);
  if(m){const a=+m[1],b=+m[2];for(let i=0;i<RULES.length;i++)if(top3[i]>=a&&top3[i]<=b)out.push(i);return out;}
  for(let i=0;i<RULES.length;i++){const id=RULES[i][0];if(id===ref||id.startsWith(ref+'.'))out.push(i);}
  return out;
}
const expandAll=refs=>{const s=new Set();refs.forEach(r=>expand(r).forEach(i=>s.add(i)));return [...s].sort((a,b)=>a-b);};
function ruleHTML(idxs,hl){
  if(!idxs.length)return '<p class="note">Nincs ilyen szabály.</p>';
  const base=Math.min(...idxs.map(i=>RULES[i][0].split('.').length));
  return idxs.map(i=>{
    const r=RULES[i],dp=Math.min(6,r[0].split('.').length-base);
    let tx=esc(r[1]);
    if(hl)tx=tx.replace(hl,m=>'<mark>'+m+'</mark>');
    const ex=(r[2]||[]).map(e=>'<div class="ex">'+(hl?esc(e).replace(hl,m=>'<mark>'+m+'</mark>'):esc(e))+'</div>').join('');
    return '<div class="rule dp'+dp+(isHead(r)?' h':'')+'" data-rid="'+r[0]+'"><a class="id" href="'+refHash(r[0])+'" title="Link erre a szabályra">'+r[0]+'.</a><div class="tx">'+tx+ex+'</div></div>';
  }).join('');
}
const refLabel=refs=>refs.join(', ');
const refHash=ref=>'#r-'+String(ref).trim().replace(/-/g,'--').replace(/\./g,'-');
const hashRef=h=>h.slice(3).split('--').map(x=>x.replace(/-/g,'.')).join('-');
const relLinks=rel=>rel&&rel.length?'<div class="rel">Kapcsolódó: '+rel.map(r=>'<a href="#szabalyok" data-ref="'+r+'">'+r+'</a>').join('')+'</div>':'';

/* ---------- kártyaszöveg ---------- */
const DOMS={R:'Fury',G:'Calm',B:'Mind',O:'Body',P:'Chaos',Y:'Order'};
const SYMT={A:['A','Power, bármely domain'],C:['C','Power, a kártya saját domainje'],S:['Might','Might'],T:['Exhaust','Exhaust (a kártya kimerítése költségként)'],E:['Exhaust','Exhaust (a kártya kimerítése költségként)']};
function cardText(t){
  if(!t)return '<p class="rem">Nincs szabályszöveg.</p>';
  return t.split('\n').map(line=>{
    let h=esc(line);
    h=h.replace(/\(([^()]*)\)/g,'<span class="rem">($1)</span>');
    h=h.replace(/\[([^\]]+)\]/g,(m,k)=>{
      if(/^\d+$/.test(k))return '<span class="sym en" title="Energy '+k+'">'+k+'</span>';
      if(k==='&gt;')return '\u25B8';
      if(k==='&gt;&gt;')return '\u00BB';
      if(SYMT[k])return '<span class="sym" title="'+SYMT[k][1]+'">'+SYMT[k][0]+'</span>';
      if(DOMS[k])return '<span class="sym dm d-'+DOMS[k]+'" title="'+DOMS[k]+' domain">'+DOMS[k]+'</span>';
      return '<span class="kw">'+k+'</span>';
    });
    return '<p>'+h+'</p>';
  }).join('');
}
const typeLine=c=>[...(c.st||[]).filter(s=>s!=='Basic'&&s!=='Token'),c.t,(c.st||[]).includes('Token')?'Token':''].filter(Boolean).join(' ');
const domDots=c=>(c.d||[]).map(d=>'<i class="dot d-'+d+'" title="'+d+'"></i>').join('');
function whyOf(tp,m){
  if(tp.g==='kw')return 'kulcsszó a kártyán: <code>'+esc(m)+'</code>';
  if(tp.g==='type')return esc(tp.why);
  return 'a szövegben: <code>'+esc(m)+'</code>';
}
const GROUPS=[['kw','Kulcsszavak'],['act','Game Actions a szövegben'],['oth','A szövegből következő további szabályok'],['type','Kártyatípus szabályai']];

function topicBlock(tp,why,open){
  return '<details class="tp"'+(open?' open':'')+'><summary><span class="rn">'+refLabel(tp.refs)+'</span><span class="tt">'+esc(tp.title)+'</span><span class="why">'+why+'</span></summary><div class="rules" data-refs="'+tp.refs.join('|')+'"></div>'+relLinks(tp.rel)+'</details>';
}
const FL=['szabály','levezetés','nyitott kérdés'];
const FLT=['A Core Rules közvetlenül kimondja.','A szabályból és a kártyaszövegből levezetett következmény, nem hivatalos ruling.','A Core Rules nem dönti el egyértelműen, judge döntése kell.'];
const TERMS=(D.extra&&D.extra.terms)||[];
const TRE=TERMS.length?new RegExp('(?<![\\p{L}\\[])('+TERMS.map(x=>x.m).sort((a,b)=>b.length-a.length).join('|')+')(?![\\p{L}])','giu'):null;
function termOf(w){const lw=w.toLowerCase();for(const x of TERMS){if(new RegExp('^(?:'+x.m+')$','iu').test(w))return x;}return null;}
const NOHL=new Set(['unit','spell','gear','legend']);
function glossify(html,seen){
  if(!TRE)return html;seen=seen||new Set();
  return html.replace(/(<[^>]+>)|([^<]+)/g,(m,tag,txt)=>tag?tag:txt.replace(TRE,w=>{const x=termOf(w);if(!x||NOHL.has(x.t)||seen.has(x.t))return w;seen.add(x.t);return '<span class="gl" tabindex="0" data-t="'+TERMS.indexOf(x)+'">'+w+'</span>';}));
}
function notesHTML(c){
  if(!c.nt)return '<h3>Hogyan érinti ezt a lapot</h3><p class="note">Ehhez a laphoz még nincs kézzel írt, lap-specifikus magyarázat. Lent a rá vonatkozó szabályszakaszok teljes szövege olvasható.</p>';
  const seen=new Set();
  return '<h3>Hogyan érinti ezt a lapot<span class="n">'+c.nt.length+' pont, nem hivatalos ruling</span></h3><div class="ntwrap"><table class="nt">'+c.nt.map(n=>'<tr><td class="r">'+n[0].split(',').map(r=>'<a href="#szabalyok" data-ref="'+r.trim()+'">'+r.trim()+'</a>').join('')+'</td><td>'+glossify(esc(n[2]),seen)+'</td><td class="f"><span class="fl f'+n[1]+'" title="'+FLT[n[1]]+'">'+FL[n[1]]+'</span></td></tr>').join('')+'</table></div>';
}
const GENERIC_TAGS=new Set(['Equipment']);
function similar(c,n){
  const kw=new Set(c._kw),act=new Set(c.tp.filter(p=>TOPICS[p[0]].g==='act').map(p=>p[0])),tg=new Set((c.tg||[]).filter(x=>!GENERIC_TAGS.has(x)));
  const out=[];
  CARDS.forEach(o=>{if(o===c||o.n===c.n||o.ban===1)return;
    let s=0;const why=[];
    const sk=o._kw.filter(k=>kw.has(k));if(sk.length){s+=3*sk.length;why.push(...sk);}
    const sa=o.tp.filter(p=>TOPICS[p[0]].g==='act'&&act.has(p[0]));s+=sa.length;
    if(o.t===c.t)s+=2;
    const st=(o.tg||[]).filter(x=>tg.has(x));if(st.length){s+=2*st.length;why.push(...st);}
    if((o.d||[]).some(d=>(c.d||[]).includes(d)))s+=1;
    if(c.e!=null&&o.e!=null)s-=Math.min(3,Math.abs(c.e-o.e))*0.5;
    if(s>=5)out.push([s,o,why.slice(0,3)]);});
  out.sort((a,b)=>b[0]-a[0]);return out.slice(0,n);
}
function similarHTML(c){
  const L=similar(c,8);if(!L.length)return '';
  return '<h3>Hasonló lapok<span class="n">közös kulcsszó, tag, típus és hatás alapján</span></h3><div class="simgrid">'+L.map(([s,o,w])=>'<button class="simc" data-sim="'+esc(o.n)+'"><b>'+domDots(o)+' '+esc(o.n)+'</b><span>'+esc(typeLine(o))+(o.e!=null?' · Energy '+o.e:'')+'</span>'+(w.length?'<span class="w">'+w.map(esc).join(', ')+'</span>':'')+'</button>').join('')+'</div>';
}
function cardRulesHTML(c){
  let h=notesHTML(c)+similarHTML(c);
  if(c.ex&&c.ex.length){
    h+='<h3>A szabályzat név szerint említi<span class="n">'+c.ex.length+' példa</span></h3>';
    h+='<details class="tp"><summary><span class="rn">'+c.ex.slice(0,3).join(', ')+(c.ex.length>3?', ...':'')+'</span><span class="tt">Példák ezzel a kártyával</span><span class="why">a Core Rules példaszövegében szerepel a kártya neve</span></summary><div class="rules" data-ids="'+c.ex.join('|')+'" data-hl="'+esc(c.a[0])+'"></div></details>';
  }
  GROUPS.forEach(([g,label])=>{
    const items=c.tp.filter(p=>TOPICS[p[0]].g===g);
    if(!items.length)return;
    h+='<h3>'+label+'<span class="n">'+items.length+'</span></h3>';
    items.forEach(p=>{h+=topicBlock(TOPICS[p[0]],whyOf(TOPICS[p[0]],p[1]),false);});
  });
  const gen=D.general.filter(g=>g.for==='all'||['Unit','Gear','Spell'].includes(c.t));
  h+='<h3>Minden kártyára érvényes általános szabályok<span class="n">'+gen.length+'</span></h3>';
  gen.forEach(g=>{h+=topicBlock({refs:g.refs,title:g.title,rel:[]},'általános',false);});
  return h;
}
function cardHeadHTML(c,tag){
  const chips=[];
  chips.push('<span class="chip">'+domDots(c)+esc(typeLine(c))+'</span>');
  if(c.d&&c.d.length)chips.push('<span class="chip">'+esc(c.d.join(' + '))+'</span>');
  if(c.e!=null)chips.push('<span class="chip">Energy <b>'+c.e+'</b></span>');
  if(c.p)chips.push('<span class="chip">Power <b>'+c.p+'</b></span>');
  if(c.m!=null)chips.push('<span class="chip">Might <b>'+c.m+'</b></span>');
  if(c.tg&&c.tg.length)chips.push('<span class="chip">'+esc(c.tg.join(', '))+'</span>');
  chips.push('<span class="chip">'+esc(c.sets.join(', '))+'</span>');
  if(c.ban===1)chips.push('<span class="chip ban">BANNED (Constructed)</span>');
  if(c.ban===2)chips.push('<span class="chip ban">BANNED 2v2 Constructed</span>');
  if(c.banf&&!c.ban)chips.push('<span class="chip ban">BANNED '+c.banf+'-tól</span>');
  if(c.err!=null)chips.push('<span class="chip err">ERRATA</span>');
  const IMG='https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/';
  let h='<div class="cardtop"><div class="main"><div class="card-head"><'+tag+' style="margin:0">'+esc(c.n)+'</'+tag+'><a class="note" href="https://playriftbound.com/en-us/card-gallery/#card-gallery--'+c.code+'">hivatalos Card Gallery ('+c.code+')</a></div><div class="meta">'+chips.join('')+'</div>';
  if(c.banf&&!c.ban)h+='<div class="banbox">Ez a kártya '+c.banf+'-tól tiltott a Standard és a 2v2 Constructed formátumban. Forrás: <a href="'+BF.url+'">'+esc(BF.title)+'</a>. Addig még játszható.</div>';
  if(c.ban===1)h+='<div class="banbox">Ez a kártya '+(c.banNew?'a '+esc(BF.title)+' cikk szerint':'a Rules Hub szerint')+' tiltott a Constructed formátumban (érvényes: '+(c.banNew?c.banf:META.ban_updated)+'). A keresőben csak a "banned kártyák is" kapcsolóval jelenik meg.</div>';
  if(c.ban===2)h+='<div class="banbox">Ez a legend a Rules Hub szerint a 2v2 Constructed formátumban tiltott (lista frissítve: '+META.ban_updated+'). 1v1 Constructedben játszható.</div>';
  h+='<h3>'+(c.err!=null?'Jelenlegi szöveg (errata után)':'Kártyaszöveg')+'</h3><div class="ctext">'+cardText(c.txt)+'</div>';
  if(c.sh)h+='<div class="short"><b>Röviden</b>'+glossify(esc(c.sh))+'<small>Egyszerűsített összefoglaló, nem hivatalos. A pontos szabályok lent.</small></div>';
  if(c.err!=null){
    const a=META.articles[c.err];
    h+='<div class="errbox">A kártya szövege megváltozott. Forrás: <a href="'+a.u+'">'+esc(a.t)+'</a>. A fenti szöveg a hatályos, a nyomtatott kártyán a régi szerepelhet.</div>';
    if(c.old)h+='<h3>Nyomtatott szöveg (errata előtt)</h3><div class="ctext old">'+cardText(c.old)+'</div>';
    else h+='<p class="note">A Card Gallery már a frissített szöveget mutatja, a régi szöveg az errata cikkben olvasható.</p>';
  }
  h+='</div>'+(c.img?'<img loading="lazy" src="'+IMG+c.img+'?w=420" alt="'+esc(c.n)+' kártyakép" onerror="this.remove()">':'')+'</div>';
  return h;
}
/* lusta szabálykitöltés: a details megnyitásakor töltjük be a szöveget */
document.addEventListener('toggle',e=>{
  const d=e.target;if(!d.open||!d.matches||!d.matches('details'))return;
  d.querySelectorAll(':scope > .rules, :scope > .body .rules-auto').forEach(()=>{});
  const box=d.querySelector(':scope > .rules');
  if(box&&!box.dataset.done){
    if(box.dataset.ids){const ids=box.dataset.ids.split('|');const idx=ids.map(id=>RULES.findIndex(r=>r[0]===id)).filter(i=>i>=0);

function parseDeck(text){

    const line=raw.trim();if(!line)return;
    let m=/^([A-Za-z][A-Za-z \-]*?)\s*:\s*$/.exec(line);
    if(m){cur={name:m[1],rows:[]};secs.push(cur);return;}
    if(!cur){cur={name:'Lista',rows:[]};secs.push(cur);}
    m=/^(\d+)\s*[xX]?\s+(.+)$/.exec(line);
    const qty=m?+m[1]:1,name=(m?m[2]:line).trim();
    const c=byName.get(norm(name))||null;

  });
  return secs;

function pdfSafe(s){return String(s).replace(/\t/g,' ').replace(/[^\n\x20-\x7E\xA0-\u017F\u2010-\u2026\u2030\u20AC\u2122\u25B8]/g,'?');}
const pdfCardText=t=>(t||'').replace(/\[S\]/g,'Might').replace(/\[>\]/g,' > ').replace(/\[>>\]/g,' >> ').replace(/\[[TE]\]/g,'[Exhaust]').replace(/\[([RGBOPY])\]/g,(m,k)=>'['+DOMS[k]+']');

    if(o.before)y+=o.before;
    if(o.keep&&y+lh(sz)*Math.min(lines.length+o.keep,6)>PH-MB){doc.addPage();y=MT;}
    lines.forEach(l=>{if(y+lh(sz)>PH-MB){doc.addPage();y=MT;}doc.text(l,ML+ind,y+sz*0.3528);y+=lh(sz);});
    if(o.after)y+=o.after;
  }
  const rule=()=>{doc.setDrawColor(150);doc.setLineWidth(0.2);doc.line(ML,y,PW-MR,y);y+=2;};
  const withRel=$('pdf-rel').checked,withGen=$('pdf-gen').checked;
  const legend=(DECK.find(s=>/legend/i.test(s.name))||{rows:[]}).rows.map(r=>r.card?r.card.n:r.name).join(', ');

  put('Jelölés a kártyaszövegben: [1] Energy, [A] bármely domain Power, [C] a kártya saját domainjének Power-e, [Exhaust] a kártya kimerítése, Might a harci érték. A szabályszöveg az eredeti angol Core Rules szöveg.',{size:8.5,color:[90,98,115],after:2});

  const lc=checkDeck();if(lc.length){put('Deck legalitás (Core Rules 103)',{size:13,style:'bold',before:3});lc.forEach(x=>put((x[0]===null?'INFO':x[0]?'OK':'HIBA')+'   '+(x[1]?x[1]+'  ':'')+x[2],{size:9,indent:2,color:x[0]===false?[160,50,15]:[20,24,34]}));}
  const seen=new Map();

    put('Érvényes szabályok:',{size:9,style:'bold',before:1.2});
    if(c.ex&&c.ex.length){put('Név szerint említi a szabályzat: '+c.ex.join(', '),{size:9,indent:3});c.ex.forEach(id=>{const i=RULES.findIndex(r=>r[0]===id);if(i>=0)used.add(i);});}

      put(refLabel(tp.refs)+'  '+tp.title+'  ('+why+')'+(tp.rel&&tp.rel.length?'  kapcsolódó: '+tp.rel.join(', '):''),{size:9,indent:3});

const tip=$('tip');let tipFor=null;
function showTip(el){const x=TERMS[+el.dataset.t];if(!x)return;tipFor=el;
  tip.innerHTML='<b>'+esc(x.t)+'</b>'+esc(x.d)+'<span class="rr">Core Rules '+esc(x.r)+'</span>';tip.hidden=false;
  const r=el.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
  let left=Math.min(Math.max(12,r.left+r.width/2-tw/2),window.innerWidth-tw-12);
  let top=r.bottom+8;if(top+th>window.innerHeight-8)top=r.top-th-8;
  tip.style.left=left+'px';tip.style.top=top+'px';}
function hideTip(){tip.hidden=true;tipFor=null;}
function showTT(el){tipFor=el;tip.innerHTML=esc(el.dataset.tt);tip.hidden=false;const r=el.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;tip.style.left=Math.min(Math.max(12,r.left+r.width/2-tw/2),window.innerWidth-tw-12)+'px';let top=r.top-th-8;if(top<8)top=r.bottom+8;tip.style.top=top+'px';}
document.addEventListener('mouseover',e=>{const g=e.target.closest&&e.target.closest('.gl');if(g){showTip(g);return;}const t2=e.target.closest&&e.target.closest('[data-tt]');if(t2){showTT(t2);return;}if(tipFor)hideTip();});
document.addEventListener('focusin',e=>{const t2=e.target.closest&&e.target.closest('[data-tt]');if(t2)showTT(t2);});
document.addEventListener('focusin',e=>{const g=e.target.closest&&e.target.closest('.gl');if(g)showTip(g);});
document.addEventListener('focusout',e=>{if(e.target.closest&&e.target.closest('.gl'))hideTip();});
document.addEventListener('click',e=>{const g=e.target.closest&&e.target.closest('.gl');if(g){if(tipFor===g)hideTip();else showTip(g);}else if(tipFor)hideTip();});

document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTip();});
function renderTud(){

    X.guide.forEach((g,i)=>{h+='<div class="guide"><h3>'+(i+1)+'. '+esc(String(g.title).replace(/^\s*\d+\.\s*/,''))+(g.rules?'<span class="n">'+rl(g.rules)+'</span>':'')+'</h3>'+(g.paras||[]).map(p=>'<p>'+glossify(esc(p))+'</p>').join('')+(g.steps&&g.steps.length?'<ol class="flow">'+g.steps.map(s=>'<li><span>'+esc(s[1])+rl(s[0])+'</span></li>').join('')+'</ol>':'')+'</div>';});

  h+='<h2 id="tud-olvas" style="margin-top:28px">A magyarázatok olvasása</h2><div class="guide">'
   +'<p>Minden kártya "Hogyan érinti ezt a lapot" listájában a pontok mellett egy címke áll. Ez mutatja, mennyire biztos az adott állítás.</p>'
   +'<ul class="olv"><li><span class="fl f0">szabály</span>A hivatkozott Core Rules szakasz szó szerint kimondja, vagy példaként leírja. Erre nyugodtan lehet építeni.</li>'
   +'<li><span class="fl f1">levezetés</span>A szabály és a kártya szövege együtt adja ki, de a szabályzat szó szerint nem írja le. Valószínűleg így működik, de ez az oldal következtetése, nem hivatalos döntés.</li>'
   +'<li><span class="fl f2">nyitott kérdés</span>A Core Rules nem ad egyértelmű választ. Tipikus okok: két szabály mást mond ugyanarra a helyzetre, a kártya olyan fogalmat használ, amit a szabályzat nem definiál (például "excess damage"), vagy nem derül ki, hogy egy esemény számít-e (például hogy az exhausted belépés "become exhausted"-nek számít-e). '+CARDS.reduce((a,c)=>a+(c.nt||[]).filter(n=>n[1]===2).length,0)+' ilyen pont van az oldalon.</li></ul>'
   +'<p>A "judge döntése kell" azt jelenti, hogy ilyenkor a versenybíró (judge) mondja meg, hogyan működik a helyzet. Hivatalos versenyen az ő döntése érvényes az adott meccsre, ezért ha egy nyitott kérdéses lap a deckedben van, érdemes a verseny előtt megkérdezni. Otthoni játéknál a játékosok előre megegyeznek, és figyelik, hogy a Riot kiad-e pontosítást (Rules Hub, errata, FAQ).</p></div>';
  if(X.terms){h+='<h2 id="tud-fog" style="margin-top:14px">Fogalmak</h2><p class="note" style="margin:6px 0 12px">A magyarázatokban használt szakszavak egyszerűen. A kártyák magyarázataiban a pontozottan aláhúzott szóra mutatva vagy koppintva is megjelennek.</p><ul class="terms">'+[...X.terms].sort((a,b)=>a.t.localeCompare(b.t)).map(x=>'<li><b>'+esc(x.t)+'</b>'+rl(x.r)+'<br>'+esc(x.d)+'</li>').join('')+'</ul>';}
  if(X.glossary){
    h+='<h2 id="tud-kw" style="margin-top:28px">Kulcsszavak</h2><p class="note" style="margin:6px 0 12px">A Core Rules 805-832 kulcsszavai röviden. A pontos szöveg a szabályszámra kattintva olvasható. AI által írt összefoglaló, nem hivatalos.</p><div class="kwgrid">';
    X.glossary.forEach(g=>{const re=new RegExp('\\['+g.kw.replace(/[-]/g,'\\-')+'(?: \\d+)?\\]');const n=CARDS.filter(c=>c.ban!==1&&re.test(c.txt||'')).length;
      h+='<div class="kwc"><h4><span class="kw">'+esc(g.kw)+'</span>'+rl(g.rule)+'</h4><div class="k">'+esc(g.kind||'')+(g.on?' · '+esc(g.on):'')+'</div><p>'+esc(g.short||'')+'</p><ul>'+(g.points||[]).map(p=>'<li>'+rl(p[0])+'<span>'+esc(p[1])+'</span></li>').join('')+'</ul>'+(g.stack?'<p class="note">Több példány: '+esc(g.stack)+'</p>':'')+'<button data-kwq="['+esc(g.kw)+'">'+n+' lap ezzel a kulcsszóval</button></div>';});
    h+='</div>';
  }
  if(X.flow){
    h+='<h2 id="tud-flow" style="margin-top:28px">Játékmenet</h2><p class="note" style="margin:6px 0 12px">A kör, a chain, a kártyakijátszás és a combat lépései a Core Rules szerint. AI által írt összefoglaló, nem hivatalos.</p>';
    X.flow.forEach(b=>{h+='<h3>'+esc(b.title)+'<span class="n">'+esc(b.rules||'')+'</span></h3><ol class="flow">'+(b.steps||[]).map(s=>'<li><span><b>'+esc(s.name)+'</b>'+rl(s.rule)+'<br>'+esc(s.text)+'</span></li>').join('')+'</ol>';});

    X.patchnotes.forEach(p=>{h+='<div class="pn"><h3 style="margin-bottom:2px"><a href="'+esc(p.url)+'">'+esc(p.title)+'</a><span class="n">'+esc(p.date||'')+(p.effective?', hatályos: '+esc(p.effective):'')+'</span></h3><ul>'+(p.changes||[]).map(c=>'<li>'+(c.rule?rl(c.rule)+' ':'')+esc(c.text)+'</li>').join('')+'</ul></div>';});
  }
  $('tud').innerHTML=h;
  $('vs-go').addEventListener('click',runVs);['vs-a','vs-b'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')runVs();}));

const vsCard=v=>byName.get(norm(v))||CARDS.find(c=>norm(c.n).startsWith(norm(v)));
const kwRef=k=>{const t=TOPICS.find(x=>x.k==='kw:'+k);return t?t.refs[0]:'';};
function vsPairs(A,B){
  const out=[];const ta=A.txt||'',tb=B.txt||'';const refsA=(A.nt||[]).flatMap(n=>n[0].split(',').map(x=>x.trim()));
  const targets=refsA.some(r=>/^355\.(7|9|10|11)/.test(r));
  const add=(ref,txt)=>out.push([ref,txt]);
  if(targets&&/can.t be chosen|cannot be chosen/i.test(tb))add('757',A.n+' választást kér, '+B.n+' szövege viszont bizonyos helyzetben kizárja, hogy kiválasszák. Ha a feltétel teljesül (például enemy spell választaná), '+B.n+' nem választható.');
  if(targets&&/\[Deflect/.test(tb))add(kwRef('Deflect')||'356.2.a',B.n+' Deflectje miatt, ha '+A.n+' őt választja, plusz költséget kell fizetni.');
  if(/counter (?:a|an|target|that|it)\b[^.]{0,30}spell|counter (?:a|an) spell/i.test(ta)&&B.t==='Spell')add('426',A.n+' counterelheti '+B.n+'-t, amíg az a chainen vár. A counterelt spell nem hat, és a kifizetett cost nem jár vissza.');
  if(/\bkill\b|\bdeal \d/i.test(ta)&&/\[Deathknell\]/.test(tb))add(kwRef('Deathknell')||'429',A.n+' megölheti '+B.n+'-t, ekkor '+B.n+' Deathknell képessége elindul.');
  if(/\bbanish/i.test(ta)&&/\[Deathknell\]/.test(tb))add('428',A.n+' banish hatása nem kill, ezért ha így kerül el '+B.n+', a Deathknell képessége nem indul.');
  if(/\bkill\b|\bdeal \d/i.test(ta)&&/(if (?:i|this|it) would die|would be killed)/i.test(tb))add('367',B.n+' replacement effectje helyettesítheti a halálát, ha '+A.n+' megölné.');
  if(/return[^.]{0,60}hand/i.test(ta)&&(B.st||[]).includes('Token'))add('186.1',A.n+' kézbe küldené '+B.n+'-t, de token kézbe kerülve megszűnik.');
  if(/return[^.]{0,60}hand/i.test(ta)&&B.t==='Unit')add('719.5',A.n+' kézbe küldheti '+B.n+'-t: ha rajta Equipment van, az leválik és a boardon marad.');
  if(A.t==='Gear'&&(A.tg||[]).includes('Equipment')&&B.t==='Unit')add('716',A.n+' Equipment, felcsatolható '+B.n+'-re: ekkor '+B.n+' megkapja a Might bonust és az Effect Textet.');
  if(/\bmove/i.test(ta)&&/can.t move|cannot move/i.test(tb))add('358.3.a',A.n+' mozgatást kér, de '+B.n+' tiltja: a lap kijátszható, a mozgás viszont negálódik.');
  if(/\[Stun\]|\bstun/i.test(ta)&&B.t==='Unit')add(kwRef('Stun')||'424',A.n+' stunolhatja '+B.n+'-t.');
  return out;
}
function runVs(){
  const A=vsCard($('vs-a').value),B=vsCard($('vs-b').value);const o=$('vs-out');
  if(!A||!B){o.innerHTML='<p class="warns" style="list-style:none"><span>Nem találom '+(!A?'az első':'a második')+' lapot. Kezdd el gépelni a nevét, és válassz a listából.</span></p>';return;}
  const p=vsPairs(A,B).map(x=>[A,x]).concat(vsPairs(B,A).map(x=>[B,x]));
  const rA=new Map(),rB=new Map();(A.nt||[]).forEach(n=>n[0].split(',').forEach(r=>rA.set(r.trim(),n[2])));(B.nt||[]).forEach(n=>n[0].split(',').forEach(r=>rB.set(r.trim(),n[2])));
  const common=[...rA.keys()].filter(r=>rB.has(r));
  let h='<div class="vsgrid">'+[A,B].map(c=>'<div class="vscard"><b>'+domDots(c)+' '+esc(c.n)+'</b><span class="note">'+esc(typeLine(c))+'</span>'+(c.sh?'<p>'+glossify(esc(c.sh))+'</p>':'')+'<button class="linkbtn" data-sim="'+esc(c.n)+'">Teljes kártyalap</button></div>').join('')+'</div>';
  h+='<h3>Felismert kölcsönhatás<span class="n">'+p.length+'</span></h3>';
  h+=p.length?'<table class="nt">'+p.map(([s,x])=>'<tr><td class="r"><a href="#szabalyok" data-ref="'+x[0]+'">'+x[0]+'</a></td><td>'+glossify(esc(x[1]))+'</td></tr>').join('')+'</table>':'<p class="note">Nincs automatikusan felismert közvetlen kölcsönhatás. Ez nem jelenti, hogy nincs: nézd meg lent a közös szabályokat és a két lap magyarázatát.</p>';
  h+='<h3>Közös szabályok a két lap magyarázatában<span class="n">'+common.length+'</span></h3>';
  h+=common.length?'<table class="nt">'+common.map(r=>'<tr><td class="r"><a href="#szabalyok" data-ref="'+r+'">'+r+'</a></td><td><b>'+esc(A.n)+':</b> '+glossify(esc(rA.get(r)))+'<br><b>'+esc(B.n)+':</b> '+glossify(esc(rB.get(r)))+'</td></tr>').join('')+'</table>':'<p class="note">A két lap magyarázata nem hivatkozik közös szabályra.</p>';
  o.innerHTML=h;
}
